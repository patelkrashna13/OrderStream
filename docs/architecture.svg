<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <style>
    .bg { fill: #1f2937; }
    .box { rx: 12; fill: #4338ca; stroke: #8b5cf6; stroke-width: 2; }
    .box-green { fill: #047857; stroke: #10b981; }
    .box-red { fill: #b91c1c; stroke: #ef4444; }
    .box-purple { fill: #4338ca; stroke: #a78bfa; }
    .box-light { fill: #111827; stroke: #374151; }
    .text { font: 16px Arial, sans-serif; fill: #f8fafc; }
    .label { font: 14px Arial, sans-serif; fill: #e2e8f0; }
    .small { font: 12px Arial, sans-serif; fill: #cbd5e1; }
    .arrow { fill: none; stroke: #cbd5e1; stroke-width: 3; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M 0 0 L 12 5 L 0 10 z" fill="#cbd5e1" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="760" fill="#0f172a" />

  <rect x="340" y="20" width="320" height="80" class="box-light" />
  <text x="500" y="50" text-anchor="middle" class="text">Client</text>
  <text x="500" y="72" text-anchor="middle" class="label">Uploads CSV / Excel File</text>

  <rect x="260" y="140" width="480" height="90" class="box-purple" />
  <text x="500" y="175" text-anchor="middle" class="text">API Server (Express)</text>
  <text x="500" y="200" text-anchor="middle" class="label">POST /upload-orders</text>
  <text x="500" y="222" text-anchor="middle" class="label">Streams multipart upload</text>

  <line x1="500" y1="100" x2="500" y2="140" class="arrow" />

  <rect x="120" y="280" width="290" height="110" class="box-green" />
  <text x="265" y="325" text-anchor="middle" class="text">GCS Upload</text>
  <text x="265" y="350" text-anchor="middle" class="label">Stream to bucket</text>
  <text x="265" y="370" text-anchor="middle" class="label">via ADC</text>

  <rect x="590" y="280" width="290" height="110" class="box-purple" />
  <text x="735" y="320" text-anchor="middle" class="text">Stream Parse & Validate</text>
  <text x="735" y="345" text-anchor="middle" class="label">Row-by-row CSV / Excel</text>

  <line x1="360" y1="190" x2="360" y2="280" class="arrow" />
  <line x1="640" y1="190" x2="640" y2="280" class="arrow" />

  <rect x="590" y="430" width="290" height="90" class="box-purple" />
  <text x="735" y="460" text-anchor="middle" class="text">Shard Router</text>
  <text x="735" y="485" text-anchor="middle" class="label">Hash(customer_id) picks shard</text>

  <rect x="120" y="430" width="290" height="90" class="box-red" />
  <text x="265" y="460" text-anchor="middle" class="text">Invalid Rows</text>
  <text x="265" y="485" text-anchor="middle" class="label">Logged and skipped</text>

  <line x1="735" y1="390" x2="735" y2="430" class="arrow" />
  <line x1="640" y1="390" x2="410" y2="430" class="arrow" />

  <rect x="120" y="560" width="240" height="100" class="box-green" />
  <text x="240" y="600" text-anchor="middle" class="text">PG Shard 0</text>
  <text x="240" y="625" text-anchor="middle" class="label">customer_id % 3 = 0</text>

  <rect x="380" y="560" width="240" height="100" class="box-green" />
  <text x="500" y="600" text-anchor="middle" class="text">PG Shard 1</text>
  <text x="500" y="625" text-anchor="middle" class="label">customer_id % 3 = 1</text>

  <rect x="640" y="560" width="240" height="100" class="box-green" />
  <text x="760" y="600" text-anchor="middle" class="text">PG Shard 2</text>
  <text x="760" y="625" text-anchor="middle" class="label">customer_id % 3 = 2</text>

  <line x1="735" y1="520" x2="620" y2="560" class="arrow" />
  <line x1="735" y1="520" x2="500" y2="560" class="arrow" />
  <line x1="735" y1="520" x2="380" y2="560" class="arrow" />

  <text x="500" y="720" text-anchor="middle" class="small">Purple = application logic · Green = storage · Red = error path</text>
</svg>
